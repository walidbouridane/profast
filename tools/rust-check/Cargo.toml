# Crate de VÉRIFICATION : compile et teste le cœur licence + fiscal
# SANS dépendance Tauri/SQLx (qui exigent les libs système de l'hôte).
# Les fichiers inclus par #[path] sont LA source même de src-tauri :
# tester ici == tester le code embarqué.
[package]
name = "rust-check"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
mac_address = "1"
