name: Build ProFast Facture (Windows .exe)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Installer Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Installer les dépendances frontend
        run: pnpm install

      - name: Compiler l'application (.exe + installeur NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ProFast Facture ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
