steps:
      - uses: actions/checkout@v4

      # 1. Installer Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. AJOUTER CECI : Installer pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # 3. Installer les dépendances JS avec pnpm
      - name: Install dependencies
        run: pnpm install

      # 4. Compiler l'application avec Tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: main
          releaseName: "ProFast Facture main"
          # ... le reste de votre config tauri-action
name: Build ProFast Facture (Windows .exe)

# Déclenchement : à chaque tag "v*" (ex: v0.1.0) ou manuellement depuis l'onglet Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest   # <-- essentiel : Tauri + WebView2 doivent être compilés SUR Windows
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Installer les dépendances frontend
        run: npm install --legacy-peer-deps

      - name: Compiler l'application (.exe + installeur NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ProFast Facture ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # Si tu préfères juste récupérer le .exe sans créer de Release GitHub,
      # remplace le step ci-dessus par ceci :
