# ProFast Facture — backend Tauri (Rust)
[package]
name = "profast-facture"
version = "0.1.0"
edition = "2021"

[lib]
name = "profast_facture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "profast-facture"
path = "src/main.rs"

# ⚠ Binaire Vendeur — construit séparément, JAMAIS distribué :
#   cargo run --bin pff-keygen -- init
#   cargo run --bin pff-keygen -- sign --hwid HWID-... --plan ANNUAL --serial PF-... --days 365
[[bin]]
name = "pff-keygen"
path = "src/bin/keygen_bin.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] } # Gardez uniquement vos autres features validestauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Licence / HWID
sha2 = "0.10"
hex = "0.4"
mac_address = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"

# Authentification PIN
argon2 = { version = "0.5", features = ["std"] }

# Base de données locale (WAL) — SQLCipher possible (chiffrement au repos)
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }

# Utilitaires
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
